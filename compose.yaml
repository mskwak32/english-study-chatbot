name: english-study-ai

services:
  ollama:
    # 공식 Ollama 이미지. ARM64 Pi에서는 ARM64 이미지를 자동으로 받습니다.
    image: ollama/ollama:latest
    restart: unless-stopped

    # 모델 파일은 컨테이너가 아니라 Docker named volume에 보관
    volumes:
      - ollama-models:/root/.ollama

    # Ollama 서버가 요청을 받을 수 있는지 확인.
    healthcheck:
      test: ["CMD", "ollama", "ps"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  agent:
    # Pi에 docker load로 가져온 Agent 이미지를 배포 명령에서 지정.
    image: ${AGENT_IMAGE:?Pi에서 로드한 Agent 이미지 태그가 필요합니다}
    restart: unless-stopped

    # Ollama 서버 health check가 통과한 뒤 Agent 시작
    depends_on:
      ollama:
        condition: service_healthy
        restart: true

    ports:
      - "8100:8000"

    environment:
      MODEL: ${MODEL:-gemma3:4b}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      TIMEZONE: ${TIMEZONE:-Asia/Seoul}
      DATABASE_URL: sqlite:////data/chat.db
      INSTRUCTIONS_PATH: /instructions

    # 이미지 내부는 읽기 전용으로 두고, 필요한 경로만 별도 mount
    read_only: true

    volumes:
      # 실제 SQLite DB를 호스트 프로젝트의 data/에 보관
      - type: bind
        source: ./data
        target: /data
        bind:
          create_host_path: false

      # Python 또는 라이브러리의 일시 파일만 메모리에 허용합니다.
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 67108864
          mode: 1777

    # Agent에 불필요한 Linux 권한을 제거합니다.
    cap_drop:
      - ALL

    # 실행 중 권한 상승을 막습니다.
    security_opt:
      - no-new-privileges:true

    # Agent 자체의 HTTP 응답을 확인합니다.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

volumes:
  # Ollama 모델을 컨테이너 재생성과 분리해 보관합니다.
  ollama-models:
