<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="개인용 영어 학습 채팅 화면" />
    <title>영어 학습</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>영어 학습</h1>
      <a
        class="learning-info-link"
        href="/learning.html"
        aria-label="학습 정보 보기"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="9" />
          <path d="M12 10v6" />
          <path d="M12 7h.01" />
        </svg>
      </a>
    </header>

    <div class="app-layout">
      <aside class="chat-sidebar" aria-labelledby="chat-list-title">
        <div class="chat-sidebar-header">
          <h2 id="chat-list-title">학습 기록</h2>
          <button id="create-chat-button" type="button" disabled>
            오늘의 추가 학습
          </button>
        </div>
        <ol id="chat-list" class="chat-list"></ol>
      </aside>

      <main id="main-content" class="main-content" aria-busy="true">
        <section
          id="start-learning"
          class="start-learning"
          aria-label="학습 시작 안내"
          hidden
        >
          <div id="today-learning-start" class="start-learning-content">
            <h3>오늘의 학습을 아직 시작하지 않았습니다.</h3>
            <p>버튼을 눌러 오늘의 기본 학습을 시작해 주세요.</p>
            <button id="start-learning-button" type="button">
              오늘의 학습 시작
            </button>
          </div>

          <div id="profile-setup" class="start-learning-content" hidden>
            <h3>학습 프로필을 만들어 보세요</h3>
            <p>학습 프로필을 만들기 위한 초기 실력 테스트를 진행합니다.</p>
            <section class="profile-setup-outline" aria-labelledby="profile-setup-outline-title">
              <h4 id="profile-setup-outline-title">테스트 구성</h4>
              <ul>
                <li>어휘 5문제</li>
                <li>문법 5문제</li>
                <li>독해 지문 1개와 문제 3개</li>
                <li>자기표현 1문제</li>
              </ul>
            </section>
            <button id="profile-setup-button" type="button">
              학습 프로필 만들기
            </button>
          </div>
          <p
            id="start-learning-status"
            class="status-message"
            role="status"
            aria-live="polite"
            hidden
          ></p>
        </section>

        <section id="chat-panel" class="chat-panel">
          <header class="chat-header">
            <h2 id="chat-title">오늘의 학습</h2>
          </header>

          <p
            id="loading-status"
            class="status-message"
            role="status"
            aria-live="polite"
          >
            학습 기록을 불러오는 중입니다.
          </p>

          <section
            id="message-list"
            class="message-list"
            aria-label="채팅 메시지"
          ></section>

          <p id="empty-message" class="empty-message" hidden>
            아직 대화가 없습니다.
          </p>

          <form id="message-form" class="message-form">
            <label class="visually-hidden" for="message-input">메시지</label>
            <textarea
              id="message-input"
              name="content"
              rows="3"
              maxlength="4000"
              placeholder="영어 학습 메시지를 입력하세요."
              enterkeyhint="send"
              disabled
              required
            ></textarea>
            <button id="send-button" type="submit" disabled>보내기</button>
          </form>
        </section>
      </main>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
