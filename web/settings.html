<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="영어 학습 시스템 설정 상태" />
    <title>설정 상태 | 영어 학습</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>영어 학습</h1>
      <a class="topbar-return-link" href="/">채팅으로 돌아가기</a>
    </header>

    <main class="settings-page" aria-busy="true">
      <section class="settings-content" aria-labelledby="settings-page-title">
        <h2 id="settings-page-title">설정 상태</h2>
        <p class="settings-description">
          현재 영어 학습 시스템의 상태를 읽기 전용으로 표시합니다.
        </p>
        <p class="learning-status" role="status" aria-live="polite">
          설정 상태를 불러오는 중입니다.
        </p>
        <div class="settings-results" aria-live="polite"></div>
      </section>
    </main>

    <script type="module" src="/settings-page.js"></script>
  </body>
</html>
