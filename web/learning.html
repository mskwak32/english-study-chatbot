<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="영어 학습 정보" />
    <title>학습 정보 | 영어 학습</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>영어 학습</h1>
      <a class="topbar-return-link" href="/">채팅으로 돌아가기</a>
    </header>

    <main class="learning-page" aria-busy="true">
      <div class="learning-navigation" role="group" aria-label="학습 정보">
        <button type="button" data-learning-section="profile" aria-pressed="true">
          학습 프로필
        </button>
        <button type="button" data-learning-section="study-records" aria-pressed="false">
          학습 이력
        </button>
        <button type="button" data-learning-section="review-words" aria-pressed="false">
          복습 단어
        </button>
      </div>

      <section class="learning-content" aria-labelledby="learning-page-title">
        <h2 id="learning-page-title">학습 프로필</h2>
        <p class="learning-status" role="status" aria-live="polite">
          학습 프로필을 불러오는 중입니다.
        </p>
        <div class="learning-results" aria-live="polite"></div>
      </section>
    </main>

    <script type="module" src="/learning-page.js"></script>
  </body>
</html>
